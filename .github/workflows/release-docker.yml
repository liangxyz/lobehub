name: Publish Docker Image
permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Normalized version tag (optional, e.g. 2.2.19-canary.39)'
        required: false
        default: ''
        type: string
      commit_sha:
        description: 'Specific commit SHA to checkout (optional)'
        required: false
        default: ''
        type: string
      channel:
        description: 'Release channel (canary or stable)'
        required: false
        default: 'canary'
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Normalized version tag (optional, e.g. 2.2.19-canary.39)'
        required: false
        default: ''
        type: string
      commit_sha:
        description: 'Exact commit SHA to checkout and build'
        required: false
        default: ''
        type: string
      channel:
        description: 'Release channel (canary or stable)'
        required: false
        default: 'canary'
        type: string
  release:
    types: [published]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }} Image
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare metadata inputs
        id: prep
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          RAW_TAG="${INPUT_TAG:-$RELEASE_TAG}"
          NORM_TAG="${RAW_TAG#v}"

          # Validate version tag syntax if provided (Docker tag standard: [a-zA-Z0-9_.-]{1,128})
          if [[ -n "${NORM_TAG}" ]]; then
            if ! [[ "${NORM_TAG}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid docker tag format: '${NORM_TAG}'" >&2
              exit 1
            fi
          fi
          echo "version=${NORM_TAG}" >> $GITHUB_OUTPUT

          # Validate channel
          IS_CANARY="false"
          if [[ "${INPUT_CHANNEL}" == "canary" ]]; then
            IS_CANARY="true"
          elif [[ "${INPUT_CHANNEL}" == "stable" ]]; then
            IS_CANARY="false"
          elif [[ -n "${INPUT_CHANNEL}" ]]; then
            echo "::error::Invalid channel '${INPUT_CHANNEL}'. Expected 'canary' or 'stable'." >&2
            exit 1
          elif [[ "${NORM_TAG}" == *"canary"* ]] || [[ "${GITHUB_REF}" == "refs/heads/canary" ]] || [[ "${RELEASE_TAG}" == *"-canary."* ]]; then
            IS_CANARY="true"
          fi
          echo "is_canary=${IS_CANARY}" >> $GITHUB_OUTPUT

          IS_LATEST="false"
          if [[ "${IS_CANARY}" != "true" ]] && [[ "${IS_PRERELEASE}" != "true" ]]; then
            IS_LATEST="true"
          fi
          echo "is_latest=${IS_LATEST}" >> $GITHUB_OUTPUT

      - name: Get commit SHA
        id: vars
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.full_sha }}
          tags: |
            type=raw,value=latest,enable=${{ steps.prep.outputs.is_latest == 'true' }}
            type=raw,value=canary,enable=${{ steps.prep.outputs.is_canary == 'true' }}
            type=raw,value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.version != '' }}
            type=raw,value=${{ steps.vars.outputs.sha_short }},enable=${{ steps.vars.outputs.sha_short != '' }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ steps.vars.outputs.sha_short }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha != '' && inputs.commit_sha || '' }}

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare metadata inputs
        id: prep
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          RAW_TAG="${INPUT_TAG:-$RELEASE_TAG}"
          NORM_TAG="${RAW_TAG#v}"

          # Validate version tag syntax if provided (Docker tag standard: [a-zA-Z0-9_.-]{1,128})
          if [[ -n "${NORM_TAG}" ]]; then
            if ! [[ "${NORM_TAG}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
              echo "::error::Invalid docker tag format: '${NORM_TAG}'" >&2
              exit 1
            fi
          fi
          echo "version=${NORM_TAG}" >> $GITHUB_OUTPUT

          # Validate channel
          IS_CANARY="false"
          if [[ "${INPUT_CHANNEL}" == "canary" ]]; then
            IS_CANARY="true"
          elif [[ "${INPUT_CHANNEL}" == "stable" ]]; then
            IS_CANARY="false"
          elif [[ -n "${INPUT_CHANNEL}" ]]; then
            echo "::error::Invalid channel '${INPUT_CHANNEL}'. Expected 'canary' or 'stable'." >&2
            exit 1
          elif [[ "${NORM_TAG}" == *"canary"* ]] || [[ "${GITHUB_REF}" == "refs/heads/canary" ]] || [[ "${RELEASE_TAG}" == *"-canary."* ]]; then
            IS_CANARY="true"
          fi
          echo "is_canary=${IS_CANARY}" >> $GITHUB_OUTPUT

          IS_LATEST="false"
          if [[ "${IS_CANARY}" != "true" ]] && [[ "${IS_PRERELEASE}" != "true" ]]; then
            IS_LATEST="true"
          fi
          echo "is_latest=${IS_LATEST}" >> $GITHUB_OUTPUT

      - name: Get commit SHA
        id: vars
        run: |
          echo "full_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.full_sha }}
          tags: |
            type=raw,value=latest,enable=${{ steps.prep.outputs.is_latest == 'true' }}
            type=raw,value=canary,enable=${{ steps.prep.outputs.is_canary == 'true' }}
            type=raw,value=${{ steps.prep.outputs.version }},enable=${{ steps.prep.outputs.version != '' }}
            type=raw,value=${{ steps.vars.outputs.sha_short }},enable=${{ steps.vars.outputs.sha_short != '' }}

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          TARGET_TAG="${{ steps.prep.outputs.version != '' && steps.prep.outputs.version || (steps.prep.outputs.is_canary == 'true' && 'canary' || 'latest') }}"
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${TARGET_TAG}
